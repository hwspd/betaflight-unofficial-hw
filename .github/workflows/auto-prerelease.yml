name: Auto Prerelease

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gd32-prerelease:
    name: Build GD32 prerelease
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch }}
    env:
      CONFIGS: HAKRCF460V2 ARROWGD460V5 GD32H757V1STARTV1
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Init required submodules
        run: git submodule update --init --checkout -- src/config lib/modules/GD32H7

      - name: Compute tools cache key
        id: tools-key
        run: echo "key=${{ runner.os }}-tools-v2-${{ hashFiles('mk/tools.mk', 'src/platform/*/mk/*.mk') }}" >> "$GITHUB_OUTPUT"

      - name: Restore ARM toolchain cache
        uses: actions/cache/restore@v5
        id: cache-tools
        with:
          path: tools
          key: ${{ steps.tools-key.outputs.key }}-gd32-auto-prerelease
          restore-keys: |
            ${{ steps.tools-key.outputs.key }}-gd32-auto-prerelease
            ${{ steps.tools-key.outputs.key }}-arm

      - name: Install ARM toolchain
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: make SDK=gd32h7 platform-tools-install

      - name: Save ARM toolchain cache
        if: steps.cache-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: tools
          key: ${{ steps.tools-key.outputs.key }}-gd32-auto-prerelease

      - name: Hydrate configuration
        run: make configs

      - name: Build GD32 targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for config in $CONFIGS; do
            rm -f obj/betaflight_*_"${config}".hex
            make CONFIG_DIR=src/config-local CONFIG="$config" EXTRA_FLAGS=-Werror 2>&1 | tee "release-assets/${config}.log"
            cp obj/betaflight_*_"${config}".hex release-assets/
          done

          (
            cd release-assets
            sha256sum betaflight_*.hex *.log > SHA256SUMS
          )

      - name: Prepare release metadata
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          build_stamp="$(date -u +%Y%m%d-%H%M%S)"
          short_sha="${GITHUB_SHA::7}"
          tag="dev-${build_stamp}-${short_sha}"

          cat > release-assets/RELEASE_NOTES.md <<EOF
          # ${tag}

          Unofficial Betaflight fork build for experimental hardware validation. Not affiliated with or endorsed by Betaflight maintainers. Use at your own risk.

          Commit: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}

          ## Included targets

          - HAKRCF460V2
          - ARROWGD460V5
          - GD32H757V1STARTV1

          ## Validation

          - Build completed in GitHub Actions for all included targets.
          - Build success is not hardware validation of these exact artifacts.
          - HAKRCF460V2 has prior bench evidence for boot, USB/CLI, sensors, flash detection and CRSF reception on physical UART1 (formerly exposed as UART0, now UART1). Physical UART2 remains unresolved.
          - Hardware UART CLI names and MSP identifiers are one-based; internal GD32 hardware identifiers and saved binary port assignments are preserved. Old textual UART commands require name translation; see src/config-local/README.md.
          - ARROWGD460V5 is a new board profile adapted from a supplied config. Boot, USB/CLI, sensors, storage, UARTs, ADC, outputs and all peripheral behavior are hardware-untested.
          - GD32H757V1STARTV1 requires current hardware evidence before publication.
          - Motor outputs, DShot, analog OSD, storage writes, arming, and flight behavior are not validated by this build workflow.
          - This release is created as a draft. Attach exact-artifact hardware evidence and obtain publication approval before publishing.
          - See src/config-local/configs/ARROWGD460V5/README.md for pin mapping, build instructions and validation scope.

          ## Assets

          - betaflight_*_HAKRCF460V2.hex
          - betaflight_*_ARROWGD460V5.hex
          - betaflight_*_GD32H757V1STARTV1.hex
          - HAKRCF460V2.log
          - ARROWGD460V5.log
          - GD32H757V1STARTV1.log
          - SHA256SUMS
          EOF

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=Dev release ${build_stamp} UTC ${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Replace existing prerelease for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-meta.outputs.tag }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          git push origin ":refs/tags/${TAG}" || true

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-meta.outputs.tag }}
          TITLE: ${{ steps.release-meta.outputs.title }}
        run: |
          gh release create "$TAG" \
            release-assets/betaflight_*.hex \
            release-assets/*.log \
            release-assets/SHA256SUMS \
            --title "$TITLE" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            --draft \
            --prerelease
